name: Deploy SITAS Cestoball to GitHub Pages

on:
  push:
    branches: ["main"]
  # -------------------------------------------------------------------------
  # CRON PARA COMPETENCIAS NACIONALES (Desactivado)
  # -------------------------------------------------------------------------
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages y limpiar artifacts viejos
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Permite una sola ejecución concurrente de despliegue
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup old Pages artifacts to free GitHub storage quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF' || true
          import json, os, urllib.request
          token = os.environ.get("GH_TOKEN", "")
          repo = os.environ.get("GH_REPO", "")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          for _ in range(3):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100", headers=headers)
              with urllib.request.urlopen(req) as resp:
                  arts = [a for a in json.loads(resp.read().decode()).get("artifacts", []) if not a.get("expired")]
              if not arts:
                  break
              print(f"Deleting {len(arts)} old artifacts to free storage...")
              for a in arts:
                  try:
                      aid = a["id"]
                      dreq = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}", headers=headers, method="DELETE")
                      urllib.request.urlopen(dreq)
                  except Exception:
                      pass
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Remove admin panel from public Pages artifact
        run: |
          rm -f ./web/admin.html ./web/admin.js ./web/admin.css ./web/*.env ./.env

      - name: Upload static web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'
          retention-days: 1

      - name: Wait for artifact metadata indexing
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
